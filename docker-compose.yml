services:
  postgres:
    image: postgres:16-alpine
    container_name: aisec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aisec
      POSTGRES_PASSWORD: aisec
      POSTGRES_DB: aisec
    ports:
      - "5433:5432"
    volumes:
      - aisec_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisec -d aisec"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aisec_pgdata:
