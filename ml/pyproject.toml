[project]
name = "aisec-ml"
version = "0.1.0"
description = "Forecasting and illustrative data pipeline for Cheta"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "httpx>=0.28.1",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.3",
  "pyyaml>=6.0.3",
  "pdfplumber>=0.11.10",
  "geopandas>=1.2.0",
  "pyogrio>=0.13.0",
  "tenacity>=9.2.1",
  "pydantic>=2.14.3",
  "jsonschema>=4.26.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
