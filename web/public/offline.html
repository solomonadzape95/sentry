<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aisec — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a332c;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        color: #8fe3cd;
        font-size: 30px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, 0.55); max-width: 320px; margin: 0 auto; }
      a { display: inline-block; margin-top: 20px; color: #8fe3cd; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">⌁</div>
      <h1>You are offline</h1>
      <p>
        The shell is cached, but this page needs a connection. Recorded inventory entries remain
        queued on this device and will sync when you reconnect.
      </p>
      <a href="/m">Try the mobile app</a>
    </main>
  </body>
</html>
