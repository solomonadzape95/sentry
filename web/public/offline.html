<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentry: offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f5ee;
        color: #1c1c18;
        font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        background: #faedb4;
        color: #1c1c18;
      }
      h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 30px; letter-spacing: -0.01em; margin: 0 0 8px; }
      p { font-size: 13px; line-height: 1.6; color: #6f6d64; max-width: 320px; margin: 0 auto; }
      a { display: inline-block; margin-top: 20px; padding: 12px 16px; background: #1c1c18; color: #f8f5ee; text-decoration: none; font-size: 12px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 2.6 29.4 16 16 29.4 2.6 16 16 2.6Z" stroke="currentColor" stroke-width="2.1" />
          <path d="M16 10.4 21.6 16 16 21.6 10.4 16 16 10.4Z" fill="currentColor" />
        </svg>
      </div>
      <h1>You are offline</h1>
      <p>
        The shell is cached, but this page needs a connection. Recorded inventory entries remain
        queued on this device and will sync when you reconnect.
      </p>
      <a href="/m">Try the mobile app</a>
    </main>
  </body>
</html>
